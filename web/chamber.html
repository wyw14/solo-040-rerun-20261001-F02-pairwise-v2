<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LockFlow Chamber</title><link rel="stylesheet" href="/assets/styles.css"></head>
<body><header><div class="brand"><span class="brand-mark">LF</span>LockFlow</div><nav><a href="/operations">Operations</a><a aria-current="page" href="/chamber">Chamber</a><a href="/interlocks">Interlocks</a><a href="/incidents">Incidents</a></nav></header>
<main><div class="page-title"><div><h1>Chamber situation</h1><div class="muted">Gate, cycle, queue and signal state</div></div><button id="refresh">Refresh</button></div><div class="grid" id="chambers"></div><div class="message" id="message"></div></main>
<script src="/assets/app.js"></script><script>
const {api,shortID,setMessage}=window.LockFlow; const host=document.querySelector('#chambers'); const message=document.querySelector('#message');
const STATE_LABEL={waiting:'standing by',admitted:'cleared',entered:'entered',withdrawn:'withdrawn',failed:'no contact'};
function queueDetail(queue){
  if(!queue||!queue.length) return '0 vessel(s)';
  const counts={};
  for(const e of queue){counts[e.state]=(counts[e.state]||0)+1;}
  const summary=Object.entries(counts).map(([s,n])=>`${n} ${STATE_LABEL[s]||s}`).join(', ');
  const rows=queue.map((e,i)=>`<tr><td>${i+1}</td><td>${e.vessel.name}</td><td><span class="badge ${e.state}">${STATE_LABEL[e.state]||e.state}</span></td></tr>`).join('');
  return `<div>${queue.length} vessel(s) — ${summary}</div><table style="margin-top:6px"><thead><tr><th>#</th><th>Vessel</th><th>State</th></tr></thead><tbody>${rows}</tbody></table>`;
}
async function load(){const items=await api('/api/chambers'); host.innerHTML=items.map((item)=>`<section class="panel"><h2>${item.chamber_id}</h2><div class="metrics"><div class="metric">Stage<strong>${item.cycle?.stage||'idle'}</strong></div><div class="metric">Upstream<strong>${item.gates?.upstream||'-'}</strong></div><div class="metric">Downstream<strong>${item.gates?.downstream||'-'}</strong></div></div><table><tr><th>Cycle</th><td>${shortID(item.cycle?.id)}</td></tr><tr><th>Queue</th><td>${queueDetail(item.queue)}</td></tr><tr><th>Emergency</th><td>${item.emergency?.status||'idle'}</td></tr></table></section>`).join(''); setMessage(message,'');}
document.querySelector('#refresh').addEventListener('click',()=>load().catch((e)=>setMessage(message,e.message))); load().catch((e)=>setMessage(message,e.message));
</script></body></html>
